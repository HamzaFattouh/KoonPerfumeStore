<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/koon-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>كون بيرفيوم | KOON PERFUME — A Universe of Fragrance</title>
    <meta name="description" content="KOON PERFUME | كون بيرفيوم — دار العطور العالمية الفاخرة." />

    <!-- Instant Language & Dark Mode Setup -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');

          var savedLang = localStorage.getItem('koon_language') || 'ar';
          document.documentElement.lang = savedLang;
          document.documentElement.dir = 'rtl';
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts: IBM Plex Sans Arabic (Arabic), Heebo (Hebrew), Playfair Display (Luxury Editorial Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#0B0A09] text-[#F5F0E7] antialiased overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
